version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: garfou_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: garfou
      POSTGRES_PASSWORD: garfou_dev
      POSTGRES_DB: garfou
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: garfou_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
