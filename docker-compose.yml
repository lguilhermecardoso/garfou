services:
  postgres:
    image: postgres:16-alpine
    container_name: garfou_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: garfou
      POSTGRES_PASSWORD: garfou_dev
      POSTGRES_DB: garfou
    ports:
      - "5433:5432"   # 5433 no host → evita conflito com Postgres local ou outros projetos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garfou -d garfou"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
